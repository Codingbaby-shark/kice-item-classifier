services:
  - type: web
    name: kice-item-classifier
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
